name: Validar frontend para o Vercel

on:
  push:
    branches: [main]
    paths:
      - 'Codigo/front/**'
      - '.github/workflows/frontend-vercel.yml'
  pull_request:
    paths:
      - 'Codigo/front/**'
      - '.github/workflows/frontend-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Codigo/front

jobs:
  build:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Codigo/front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar build de produção
        run: npm run build
