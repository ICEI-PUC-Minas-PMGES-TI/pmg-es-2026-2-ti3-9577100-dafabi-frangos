<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1070" width="1500" height="1070" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <!-- Ponta de seta aberta, usada em «include» e «extend» -->
    <marker id="seta" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#333" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1500" height="1070" fill="#ffffff"/>

  <!-- Título -->
  <text x="750" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#000">Diagrama de Caso de Uso: DaFabi Frangos</text>
  <text x="750" y="78" text-anchor="middle" font-size="17" fill="#444">Escopo da Sprint 4 (detalhado)</text>

  <!-- Generalização: Administradora herda de Operador de caixa -->
  <polyline points="1390,656 1390,108 110,108 110,238" fill="none" stroke="#333" stroke-width="1.3"/>
  <polygon points="110,256 100,238 120,238" fill="#fff" stroke="#333" stroke-width="1.3"/>

  <!-- Fronteira do sistema -->
  <rect x="250" y="135" width="1000" height="895" rx="6" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="750" y="165" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Sistema DaFabi Frangos</text>

  <!-- Rótulos dos grupos -->
  <g font-size="12" fill="#888" font-weight="bold" letter-spacing="1">
    <text x="268" y="195">AUTENTICAÇÃO E SESSÃO</text>
    <text x="268" y="376">DASHBOARD FINANCEIRO</text>
    <text x="268" y="568">ESTORNOS</text>
    <text x="268" y="748">USUÁRIOS E PERFIS</text>
  </g>

  <!-- Atores -->
  <g stroke="#333" stroke-width="1.3" fill="none">
    <!-- Operador de caixa -->
    <circle cx="110" cy="270" r="14" fill="#fff"/>
    <line x1="110" y1="284" x2="110" y2="330"/>
    <line x1="85" y1="300" x2="135" y2="300"/>
    <line x1="110" y1="330" x2="90" y2="365"/>
    <line x1="110" y1="330" x2="130" y2="365"/>
    <!-- Administradora -->
    <circle cx="1390" cy="670" r="14" fill="#fff"/>
    <line x1="1390" y1="684" x2="1390" y2="730"/>
    <line x1="1365" y1="700" x2="1415" y2="700"/>
    <line x1="1390" y1="730" x2="1370" y2="765"/>
    <line x1="1390" y1="730" x2="1410" y2="765"/>
  </g>
  <text x="110" y="392" text-anchor="middle" font-size="16" fill="#222">Operador de caixa</text>
  <text x="1390" y="792" text-anchor="middle" font-size="16" fill="#222">Administradora</text>

  <!-- Associações ator ↔ caso de uso -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="135" y1="300" x2="350" y2="238"/>
    <line x1="135" y1="300" x2="350" y2="328"/>
    <line x1="1365" y1="700" x2="1098" y2="465"/>
    <line x1="1365" y1="700" x2="1090" y2="652"/>
    <line x1="1365" y1="700" x2="1100" y2="885"/>
  </g>

  <!-- Relações «include» (base → incluído) e «extend» (extensão → base) -->
  <g stroke="#333" stroke-width="1.2" stroke-dasharray="7,5" fill="none" marker-end="url(#seta)">
    <line x1="650" y1="235" x2="764" y2="235"/>   <!-- UC-01 → UC-01.1 -->
    <line x1="762" y1="442" x2="636" y2="422"/>   <!-- UC-02 → UC-02.1 -->
    <line x1="636" y1="505" x2="766" y2="480"/>   <!-- UC-02.2 → UC-02 -->
    <line x1="772" y1="640" x2="637" y2="612"/>   <!-- UC-17 → UC-04 -->
    <line x1="775" y1="662" x2="637" y2="694"/>   <!-- UC-17 → UC-17.1 -->
    <line x1="630" y1="797" x2="786" y2="842"/>   <!-- UC-18.1 → UC-18 -->
    <line x1="636" y1="880" x2="759" y2="880"/>   <!-- UC-18.2 → UC-18 -->
    <line x1="630" y1="963" x2="786" y2="918"/>   <!-- UC-18.3 → UC-18 -->
  </g>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="707" y="226">«include»</text>
    <text x="700" y="420">«include»</text>
    <text x="702" y="481">«extend» (PE1)</text>
    <text x="706" y="613">«include»</text>
    <text x="704" y="699">«include»</text>
    <text x="708" y="811" transform="rotate(16 708 811)">«extend» (PE1)</text>
    <text x="698" y="871">«extend» (PE1)</text>
    <text x="708" y="932" transform="rotate(-16 708 932)">«extend» (PE1)</text>
  </g>

  <!-- Casos de uso -->
  <g fill="#fff" stroke="#333" stroke-width="1.2">
    <ellipse cx="500" cy="235" rx="150" ry="34"/>
    <ellipse cx="500" cy="330" rx="150" ry="34"/>
    <ellipse cx="930" cy="235" rx="165" ry="34"/>

    <ellipse cx="930" cy="460" rx="170" ry="58"/>
    <ellipse cx="470" cy="420" rx="165" ry="34"/>
    <ellipse cx="470" cy="505" rx="165" ry="34"/>

    <ellipse cx="930" cy="650" rx="160" ry="36"/>
    <ellipse cx="470" cy="610" rx="165" ry="34"/>
    <ellipse cx="470" cy="695" rx="165" ry="34"/>

    <ellipse cx="930" cy="880" rx="170" ry="58"/>
    <ellipse cx="470" cy="790" rx="165" ry="34"/>
    <ellipse cx="470" cy="880" rx="165" ry="34"/>
    <ellipse cx="470" cy="970" rx="165" ry="34"/>
  </g>

  <!-- Divisórias dos pontos de extensão -->
  <g stroke="#333" stroke-width="1">
    <line x1="762" y1="458" x2="1098" y2="458"/>
    <line x1="762" y1="878" x2="1098" y2="878"/>
  </g>

  <!-- Nomes dos casos de uso -->
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="500" y="233">UC-01: Autenticar Usuário</text>
    <text x="500" y="328">UC-01.2: Encerrar Sessão</text>
    <text x="930" y="233">UC-01.1: Validar Credenciais e Perfil</text>

    <text x="930" y="432">UC-02: Visualizar Dashboard</text>
    <text x="470" y="418">UC-02.1: Consultar Resumo Financeiro</text>
    <text x="470" y="503">UC-02.2: Filtrar por Período</text>

    <text x="930" y="648">UC-17: Registrar Estorno</text>
    <text x="470" y="608">UC-04: Consultar Histórico de Vendas</text>
    <text x="470" y="693">UC-17.1: Informar Motivo do Estorno</text>

    <text x="930" y="852">UC-18: Gerenciar Usuários</text>
    <text x="470" y="788">UC-18.1: Cadastrar Usuário</text>
    <text x="470" y="878">UC-18.2: Editar Usuário e Perfil</text>
    <text x="470" y="968">UC-18.3: Inativar Usuário</text>
  </g>

  <!-- Issues vinculadas -->
  <g font-size="12" fill="#777" text-anchor="middle">
    <text x="500" y="252">#59 · #60</text>
    <text x="500" y="347">#60</text>
    <text x="930" y="252">#59</text>

    <text x="930" y="449">#61 · #62</text>
    <text x="470" y="437">#61 · #62</text>
    <text x="470" y="522">#62</text>

    <text x="930" y="667">#63 · #64</text>
    <text x="470" y="627">#64</text>
    <text x="470" y="712">#63 · #64</text>

    <text x="930" y="869">#58</text>
    <text x="470" y="807">#58</text>
    <text x="470" y="897">#58</text>
    <text x="470" y="987">#58</text>
  </g>

  <!-- Compartimentos de pontos de extensão -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="930" y="478" font-weight="bold">pontos de extensão</text>
    <text x="930" y="496">PE1: Filtros do dashboard</text>
    <text x="930" y="898" font-weight="bold">pontos de extensão</text>
    <text x="930" y="916">PE1: Ações sobre usuário</text>
  </g>

</svg>
