spring:
  application:
    name: dafabi-backend
  profiles:
    default: prod
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

app:
  integrations:
    max-file-bytes: 10485760
  security:
    jwt:
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}

logging:
  level:
    root: INFO
    com.dafabi: DEBUG
