services:
  postgres:
    image: postgres:16-alpine
    container_name: dafabi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dafabidb}
      POSTGRES_USER: ${DB_USER:-dafabi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dafabipassword123}
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 160M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/icei-puc-minas-pmges-ti/dafabi-backend:homelab}
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: dafabi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dafabidb}
      DB_USER: ${DB_USER:-dafabi_user}
      DB_PASSWORD: ${DB_PASSWORD:-dafabipassword123}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-https://dafabi.flxcloud.dev}
      JAVA_OPTS: "-Xms128m -Xmx220m -XX:+UseSerialGC -XX:MaxMetaspaceSize=110m -XX:TieredStopAtLevel=1"
    deploy:
      resources:
        limits:
          memory: 384M

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/icei-puc-minas-pmges-ti/dafabi-frontend:homelab}
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: dafabi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONT_PORT:-3000}:80"
    deploy:
      resources:
        limits:
          memory: 32M

  watchtower:
    image: containrrr/watchtower
    container_name: dafabi-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/config.json:ro
    environment:
      - DOCKER_API_VERSION=1.45
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_INTERVAL:-120}
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_REVIVE_STOPPED=false
    command: dafabi-backend dafabi-frontend

volumes:
  postgres_data:
