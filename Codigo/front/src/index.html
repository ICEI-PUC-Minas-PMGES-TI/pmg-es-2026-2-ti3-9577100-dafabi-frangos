<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>DaFabi Frangos — Gestão</title>
  <meta name="description" content="Sistema de vendas e gestão da DaFabi Frangos">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#B42318">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Os ícones (Material Symbols Rounded) vêm empacotados no build via node_modules/material-symbols. -->
</head>
<body>
  <app-root>
    <div class="boot-splash" role="status" aria-live="polite">
      <img src="favicon.svg" alt="" width="56" height="56">
      <strong>DaFabi Frangos</strong>
      <span>Carregando o sistema…</span>
      <i aria-hidden="true"></i>
    </div>
    <style>
      .boot-splash{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:10px;font-family:'DM Sans',Arial,sans-serif;color:#292524;background:#fafaf7}
      .boot-splash strong{font-size:1.2rem}.boot-splash span{color:#6f6964;font-size:.85rem}
      .boot-splash i{width:120px;height:4px;border-radius:4px;background:linear-gradient(90deg,#b42318 0 40%,#f3e1df 40%);background-size:200% 100%;animation:boot 1.1s linear infinite}
      @keyframes boot{from{background-position:100% 0}to{background-position:-100% 0}}
      @media (prefers-reduced-motion:reduce){.boot-splash i{animation:none}}
    </style>
  </app-root>
</body>
</html>
