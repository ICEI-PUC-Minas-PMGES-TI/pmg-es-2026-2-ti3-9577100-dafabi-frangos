server {
    listen 80;
    server_name _;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Favicon handling
    location = /favicon.svg {
        root /usr/share/nginx/html;
        default_type image/svg+xml;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        default_type image/x-icon;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
        log_not_found off;
    }

    # Static Frontend (Angular SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Resposta JSON amigável caso o backend esteja inicializando
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Retry-After "10";
        return 503 '{"code":"SERVICE_STARTING","detail":"O servidor está inicializando após uma atualização. Aguarde alguns instantes e recarregue a página."}';
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
