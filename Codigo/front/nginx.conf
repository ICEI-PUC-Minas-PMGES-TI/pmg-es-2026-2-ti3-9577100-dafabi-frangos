# Determina o IP real do cliente (via Cloudflare Tunnel ou fallback para remote_addr)
map $http_cf_connecting_ip $client_real_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Zonas de Rate Limiting e Conexões:
# 1. API: Limite de 15 requisições por segundo por IP, com rajada (burst) de até 25 requisições
limit_req_zone $client_real_ip zone=api_limit:10m rate=15r/s;

# 2. Conexões simultâneas por IP: Limite de 15 conexões ativas por IP
limit_conn_zone $client_real_ip zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    # Status retornado quando os limites forem atingidos
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Favicon handling
    location = /favicon.svg {
        root /usr/share/nginx/html;
        default_type image/svg+xml;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        default_type image/x-icon;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
        log_not_found off;
    }

    # Static Frontend (Angular SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy (Protegido com Rate Limiting e Connection Limiting)
    location /api/ {
        # Proteção contra DoS / flood:
        limit_req zone=api_limit burst=25 nodelay;
        limit_conn conn_limit 15;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Resposta JSON amigável caso o backend esteja inicializando ou sofrendo rate-limit
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
        error_page 429 = @rate_limited;
    }

    location @backend_down {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Retry-After "10";
        return 503 '{"code":"SERVICE_STARTING","detail":"O servidor está inicializando após uma atualização. Aguarde alguns instantes e recarregue a página."}';
    }

    location @rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Retry-After "5";
        return 429 '{"code":"TOO_MANY_REQUESTS","detail":"Muitas requisições enviadas ao mesmo tempo. Aguarde alguns instantes e tente novamente."}';
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
